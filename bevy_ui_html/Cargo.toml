[package]
name = "bevy_ui_html"
version = "0.0.1"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
rstml = "0.12"
syn = "2.0"

[dev-dependencies]
bevy = { version = "0.18", default-features = false, features = ["bevy_picking", "bevy_ui"] }
bevy_ui_html_core = { path = "../bevy_ui_html_core" }

[lints]
workspace = true

[lib]
proc-macro = true

[features]
# Auto propagates values that are typically propagated in CSS
propagate = []
# Allows Bevy Feathers usage for additional Elements
feathers = []
