[package]
name = "bevy_ui_html_macro"
version = "0.0.2"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
rstml = { version = "0.13", git = "https://github.com/ekwoka/rstml", branch = "allow-attributes-starting-with-at" }
syn = "3.0"

[lints]
workspace = true

[lib]
proc-macro = true

[features]
# Auto propagates values that are typically propagated in CSS
propagate = []
# Allows Bevy Feathers usage for additional Elements
feathers = []
